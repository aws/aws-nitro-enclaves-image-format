[package]
name = "eif_extract"
version = "0.1.0"
authors = ["The AWS Nitro Enclaves Team <aws-nitro-enclaves-devel@amazon.com>"]
edition = "2018"
license = "Apache-2.0"
description = "This CLI tool extracts the sections of an enclave image format (EIF) file used in AWS Nitro Enclaves, so they can be inspected or reassembled with eif_build."
repository = "https://github.com/aws/aws-nitro-enclaves-image-format"
readme = "README.md"
keywords = ["Nitro", "Enclaves", "AWS", "EIF"]
rust-version = "1.94.1"

[dependencies]
aws-nitro-enclaves-image-format = { version = "0.8", path = ".." }
serde_json = "1.0"
clap = { version = "~4.4", features = ["derive", "string"] }

[dev-dependencies]
openssl = "0.10"
sha2 = "0.10"
tempfile = "3.5"
