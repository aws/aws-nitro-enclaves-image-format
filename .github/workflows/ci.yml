name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  # A push to main can get a newer toolchain than its pull request run had.
  # Pushes to main only warn about lints; pull requests keep denying them.
  RUSTFLAGS: ${{ github.event_name == 'push' && '--cap-lints=warn' || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.94.1, stable, nightly]
    steps:
    - uses: actions/checkout@v3
    - run: rustup install ${{ matrix.rust }}
    - run: cargo +${{ matrix.rust }} build --workspace --verbose
    - run: |
        cargo +${{ matrix.rust }} test --workspace --verbose \
            -- --skip utils::tests::kms # Requires AWS creds
    - run: cargo +${{ matrix.rust }} test --no-default-features --verbose
  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: rustup component add clippy
    - run: cargo clippy --workspace
    - run: cargo clippy --no-default-features
  rustfmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: rustup component add rustfmt
    - run: cargo fmt --all --check
